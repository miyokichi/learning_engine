[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-engine"
version = "0.3.0"
readme = "README.md"
description = "Evidence-grounded judgment learning and natural-language procedure debriefs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
learning-engine = "learning_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["learning_engine*"]
